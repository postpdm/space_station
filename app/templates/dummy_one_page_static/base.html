<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>
	{% block title %}{% endblock %}
	</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #34d399;
            --info-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

		/* Unvisited link - Bright Cyan */
		a:link {
		  color: #00d2ff;
		  text-decoration: none;
		  transition: color 0.2s ease, text-shadow 0.2s ease;
		}

		/* Visited link - Dark Blue */
		a:visited {
		  color: #005580;
		}

		/* Hover state - Glowing Purple */
		a:hover {
		  color: #bf55ec;
		  text-shadow: 0 0 8px rgba(191, 85, 236, 0.6);
		}

		/* Active state (moment of click) - Keeps purple or can be customized */
		a:active {
		  color: #9b59b6;
		}

		/* Keyboard navigation focus (for accessibility) */
		a:focus {
		  outline: 2px dashed #bf55ec;
		  outline-offset: 4px;
		}


        .calculator-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            background: linear-gradient(to right, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        /* Formula Presentation Styles */
        .formula-container {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .math-formula {
            display: inline-flex;
            align-items: center;
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            color: #e2e8f0;
            user-select: none;
        }

        .math-variable {
            font-style: italic;
        }

        .math-operator {
            margin: 0 4px;
        }

        .math-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 6px;
            vertical-align: middle;
        }

        .math-numerator {
            padding-bottom: 2px;
            width: 100%;
        }

        .math-denominator {
            border-top: 1px solid currentColor;
            padding-top: 2px;
            width: 100%;
        }

        sub {
            font-size: 65%;
            margin-left: 1px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        select option {
            background: #1e293b;
            color: var(--text-main);
        }

        optgroup {
            background: #0f172a;
            color: var(--accent-color);
            font-style: normal;
            font-weight: bold;
        }

        .pressure-switch {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(15, 23, 42, 0.4);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .pressure-switch label {
            margin: 0;
            padding: 10px;
            text-align: center;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            transition: all 0.2s ease;
            text-transform: none;
        }

        .pressure-switch input[type="radio"] {
            display: none;
        }

        .pressure-switch input[type="radio"]:checked + label {
            background: var(--accent-color);
            color: #fff;
            font-weight: bold;
        }

        .slider-container {
            background: rgba(15, 23, 42, 0.4);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .slider-value {
            font-weight: 700;
            color: var(--info-color);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .animated-group {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease;
        }

        .animated-group.show {
            max-height: 100px;
            opacity: 1;
            margin-top: 16px;
        }

        .badges-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .info-badge {
            font-size: 12px;
            color: var(--info-color);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .results-panel {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 20px;
            padding: 24px;
            margin-top: 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .results-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-color);
        }

        .result-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--success-color);
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
            word-break: break-all;
        }

        .result-sub {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 6px;
        }
    </style>
</head>
<body>

{% block body %}Base{% endblock %}


</body>
</html>
