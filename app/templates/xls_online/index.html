<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editable Excel File Viewer & Downloader</title>
    <!-- Load SheetJS library via CDN -->
    <script src="/static/xls/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .upload-section {
            border: 2px dashed #007bff;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            background: #f8f9fa;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #fileInput {
            display: none;
        }
        .actions-section {
            margin-top: 15px;
            margin-bottom: 15px;
            display: none; /* Hidden by default until a file is loaded */
        }
        .btn-download {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 10px;
            text-align: left;
            outline: none;
        }
        /* Visual cue for editable cells */
        td[contenteditable="true"]:focus {
            background-color: #e8f0fe;
            box-shadow: inset 0 0 0 2px #007bff;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
        .hint-text {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Editable Excel File Viewer & Downloader (.xls / .xlsx)</h2>
    
    <!-- File upload dropzone -->
    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <p>Click here or drag and drop an Excel file to upload</p>
        <input type="file" id="fileInput" accept=".xls,.xlsx">
    </div>

    <!-- Error message display area -->
    <div id="errorMessage" class="error"></div>

    <!-- Hint text for users -->
    <div id="hintText" class="hint-text">💡 Click on any body cell to edit its content.</div>

    <!-- Actions area (contains download button) -->
    <div id="actionsSection" class="actions-section">
        <button id="downloadBtn" class="btn-download">Download as XLSX</button>
    </div>
    
    <!-- Table output display container -->
    <div class="table-container" id="tableOutput"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const tableOutput = document.getElementById('tableOutput');
    const errorMessage = document.getElementById('errorMessage');
    const actionsSection = document.getElementById('actionsSection');
    const downloadBtn = document.getElementById('downloadBtn');
    const hintText = document.getElementById('hintText');

    // Global variables to keep track of state
    let jsonData = [];
    let headers = [];

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Clear all previous data and reset state immediately on new file load
        errorMessage.innerText = "";
        tableOutput.innerHTML = "Loading...";
        actionsSection.style.display = "none";
        hintText.style.display = "none";
        jsonData = [];
        headers = [];

        const reader = new FileReader();
        reader.readAsArrayBuffer(file);

        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                // Convert worksheet rows to array of arrays (2D Array) to perfectly capture columns
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                if (rawData.length === 0) {
                    errorMessage.innerText = "The selected file is empty.";
                    tableOutput.innerHTML = "";
                    return;
                }

                // First row contains column headers
                headers = rawData[0];
                
                // Remaining rows contain actual database records
                jsonData = rawData.slice(1);

                // Build and display the interactive table
                renderTable();

                // Display UI action fields
                actionsSection.style.display = "block";
                hintText.style.display = "block";
            } catch (error) {
                errorMessage.innerText = "Error reading file. Please ensure it is a valid Excel document.";
                tableOutput.innerHTML = "";
                console.error(error);
            }
        };

        reader.onerror = function() {
            errorMessage.innerText = "File system read error.";
            tableOutput.innerHTML = "";
        };
    });

    // Function to render HTML table based on internal javascript array state
    function renderTable() {
        let html = '<table><thead><tr>';
        
        // Render headers
        headers.forEach(header => {
            html += `<th>${header || ''}</th>`;
        });
        html += '</tr></thead><tbody>';

        // Render records data rows
        jsonData.forEach((row, rowIndex) => {
            html += '<tr>';
            headers.forEach((_, colIndex) => {
                // Safely grab cell value or fallback to empty space string token
                const cellValue = row[colIndex] !== undefined ? row[colIndex] : '';
                html += `<td contenteditable="true" data-row="${rowIndex}" data-col="${colIndex}">${cellValue}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table>';

        tableOutput.innerHTML = html;

        // Add real-time event listener to update internal JS memory model as user types
        tableOutput.querySelectorAll('td').forEach(cell => {
            cell.addEventListener('blur', function() {
                const r = parseInt(this.getAttribute('data-row'));
                const c = parseInt(this.getAttribute('data-col'));
                
                // Initialize the sub-row array if it wasn't populated fully
                if (!jsonData[r]) jsonData[r] = [];
                
                // Capture edited string inside UI and sync back to array store
                jsonData[r][c] = this.innerText.trim();
            });
        });
    }

    // Handle downloading the currently updated array dataset straight back into a new Excel spreadsheet
    downloadBtn.addEventListener('click', function() {
        if (jsonData.length === 0 && headers.length === 0) return;

        // Combine headers and modified rows array data back into a single array block matrix
        const fullOutputData = [headers, ...jsonData];

        // Create virtual sheet strictly tracking the array data structure matrix values
        const updatedWorksheet = XLSX.utils.aoa_to_sheet(fullOutputData);
        
        // Setup empty container book
        const newWorkbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(newWorkbook, updatedWorksheet, "Sheet1");

        // Force downstream client terminal disk file writing stream execution
        XLSX.writeFile(newWorkbook, 'edited_file.xlsx');
    });
</script>

</body>
</html>
