{% extends 'user_portal/base.html' %}
{% block title %}Space station user portal{% endblock %}
{% block body %}

{% if username %}
<h1>User profile</h1>
{{username}}

<h2>User favorites applications</h2>

    <button onclick="loadApps()">Read apps</button>

   <table border="1">
  <thead>
    <tr>
      <th>Title</th>
      <th>Links</th>

    </tr>
  </thead>
  <tbody id="table-body">
    <!-- data -->
  </tbody>
</table>

    <script>

	  async function loadApps() {

fetch('/userfav/userfav/')
  .then(response => response.json())
  .then(data => {
    // print
	const tableBody = document.getElementById('table-body');

// delete table
tableBody.innerHTML = '';

const FavPlugins = [];

// array
data.items.forEach(item => {

FavPlugins.push ( item.plugin_UUID );
  });

  {% for p in cached_plugins %}
	  if (FavPlugins.includes( '{{p.ID}}' )) {
	  const row = `
		<tr>
			<td>{{p.user_title}}</td>
		  <td>
		  <p>{{p.user_description}}</p>
		{% for c in p.controllers %}
			<a href="{{c.path}}">{{p.user_title}} application start page</a>
		{% endfor %}
		  </td>
		</tr>
	  `;
	  tableBody.innerHTML += row;
	  };
  {% endfor %}

  })
  //.catch(error => {
  //  document.getElementById('table-body').textContent = 'Fail!';
  //})

  ;

			};


  window.onload = loadApps;
</script>


{% else %}

<a href="/users/login">Login</a>
{% endif %}

{% endblock %}
