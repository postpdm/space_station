<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="100%">
    <!-- Fixed background to ensure proper rendering in all browsers -->
    <!--  <rect width="100%" height="100%" fill="#000000"/> -->

    <!-- Clean, high-contrast Yautja countdown glyphs from the 1987 movie -->
    <g stroke="#00FF00" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" fill="none">
        
        <!-- Symbol 1: Sharp chevron with vertical spine and dual dot markers -->
        <g transform="translate(50, 60)">
            <path d="M 15 10 L 45 40 L 15 70" />
            <path d="M 45 10 L 45 90" stroke-width="5" />
            <circle cx="75" cy="25" r="6" fill="#00FF00" stroke="none" />
            <circle cx="75" cy="65" r="6" fill="#00FF00" stroke="none" />
        </g>

        <!-- Symbol 2: Fragmented digital segment (segmented diamond variant) -->
        <g transform="translate(200, 60)">
            <path d="M 10 50 L 35 10 L 60 30" />
            <path d="M 20 90 L 55 90 L 65 50" stroke-width="5" />
            <circle cx="35" cy="50" r="6" fill="#00FF00" stroke="none" />
        </g>

        <!-- Symbol 3: Cross-blades with centered core indicator -->
        <g transform="translate(350, 60)">
            <path d="M 15 10 L 30 35 M 45 60 L 60 85" />
            <path d="M 60 10 L 45 35 M 30 60 L 15 85" />
            <path d="M 37 15 L 37 45" stroke-width="7" />
            <circle cx="37" cy="65" r="7" fill="#00FF00" stroke="none" />
        </g>

        <!-- Symbol 4: Serrated crown glyph with external apex dot -->
        <g transform="translate(500, 60)">
            <path d="M 10 25 L 25 85 L 40 45 L 55 85 L 70 25" />
            <circle cx="40" cy="15" r="6" fill="#00FF00" stroke="none" />
        </g>

        <!-- Symbol 5: Parallel hunting blades with dual base dots -->
        <g transform="translate(650, 60)">
            <path d="M 20 10 L 20 90 M 50 10 L 50 90" />
            <path d="M 10 40 L 60 40" stroke-width="4" />
            <circle cx="20" cy="110" r="6" fill="#00FF00" stroke="none" />
            <circle cx="50" cy="110" r="6" fill="#00FF00" stroke="none" />
        </g>

        <!-- Symbol 6: Classic countdown zigzag with offset status marker -->
        <g transform="translate(800, 60)">
            <path d="M 50 10 L 15 35 L 50 60 L 15 85" stroke-width="7" />
            <circle cx="60" cy="48" r="6" fill="#00FF00" stroke="none" />
        </g>

    </g>
</svg>
