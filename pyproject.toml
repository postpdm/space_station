[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space_station"
version = "0.0.1"
description = "Space Station project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=space_station --cov-report=xml"
testpaths = [
    "tests",
]
